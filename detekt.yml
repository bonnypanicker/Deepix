build:
  maxIssues: 120
  weights:
    complexity: 2
    style: 1
    performance: 3

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
  WildcardImport:
    active: true
  UnusedImports:
    active: true
  NoTabs:
    active: true
  MagicNumber:
    active: false

complexity:
  active: true
  CognitiveComplexMethod:
    active: true
    threshold: 30
  CyclomaticComplexMethod:
    active: true
    threshold: 25
  LargeClass:
    active: true
    threshold: 900
  LongParameterList:
    active: true
    functionThreshold: 7
    ignoreDefaultParameters: true
  LongMethod:
    active: true
    threshold: 120
  TooManyFunctions:
    active: true
    thresholdInClasses: 80
    thresholdInFiles: 90
  ReturnCount:
    active: false
    excludeGuardClauses: true

performance:
  active: true
  SpreadOperator:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
    excludes: ['**/test/**']
  SwallowedException:
    active: true
