<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deepix Indexing Orb</title>
<style>
  :root{
    --blue: #1170ee;
    --blue-soft: #1170eecc;
  }
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#0a0a0a; /* preview only, artifact itself is transparent */
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, Roboto, sans-serif;
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:48px;
  }
  .label{
    color:#888;
    font-size:13px;
    letter-spacing:0.5px;
  }

  /* ---------- Large preview orb ---------- */
  .orb-wrap{
    position:relative;
    width:160px;
    height:160px;
  }
  .orb-wrap svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  /* Ring: expands outward and fades, then resets (radar pulse) */
  .ring{
    transform-origin:center;
    transform-box:fill-box;
    animation: ringPulse 1.8s cubic-bezier(0.4,0,0.2,1) infinite;
  }
  @keyframes ringPulse{
    0%   { transform:scale(0.82); opacity:0; }
    12%  { opacity:1; }
    55%  { transform:scale(1.05); opacity:0.9; }
    100% { transform:scale(1.32); opacity:0; }
  }

  /* Static thin track ring, always faintly visible */
  .track{
    opacity:0.18;
  }

  /* Inner disc: contracts as ring expands (inverse breathing) */
  .disc{
    transform-origin:center;
    transform-box:fill-box;
    animation: discBreathe 1.8s cubic-bezier(0.4,0,0.2,1) infinite;
  }
  @keyframes discBreathe{
    0%   { transform:scale(1);    opacity:1; }
    55%  { transform:scale(0.62); opacity:0.85; }
    100% { transform:scale(1);    opacity:1; }
  }

  /* Inner white gap ring stays proportionally matched to disc via mask, so simplest:
     we keep gap ring static size, disc shrinks inside it, revealing more gap = "contract" */

  /* ---------- Small search-bar size demo ---------- */
  .searchbar{
    display:flex;
    align-items:center;
    gap:10px;
    background:#161616;
    border:1px solid #2a2a2a;
    border-radius:24px;
    padding:10px 16px;
    width:280px;
  }
  .searchbar input{
    background:transparent;
    border:none;
    outline:none;
    color:#e8e8e8;
    font-size:14px;
    flex:1;
  }
  .searchbar input::placeholder{ color:#666; }
  .mini-orb{
    position:relative;
    width:20px;
    height:20px;
    flex-shrink:0;
  }
  .mini-orb svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }
</style>
</head>
<body>

<div class="stage">

  <div>
    <div class="orb-wrap" id="bigOrb"></div>
    <div class="label" style="text-align:center;margin-top:10px;">Preview — 160px</div>
  </div>

  <div>
    <div class="searchbar">
      <div class="mini-orb" id="miniOrb"></div>
      <input placeholder="Indexing your photos…" disabled />
    </div>
    <div class="label" style="text-align:center;margin-top:10px;">In context — search bar, 20px</div>
  </div>

</div>

<script>
// SVG built once, injected into both containers at their native viewBox (scales via CSS width/height)
const svgMarkup = `
<svg viewBox="0 0 200 200">
  <!-- faint static track so the ring has a "home" position to pulse from -->
  <circle class="track" cx="100" cy="100" r="88" fill="none" stroke="#1170ee" stroke-width="24"/>

  <!-- animated outer ring (expands + fades) -->
  <circle class="ring" cx="100" cy="100" r="88" fill="none" stroke="#1170ee" stroke-width="24"/>

  <!-- white gap ring (fixed) -->
  <circle cx="100" cy="100" r="66" fill="none" stroke="#000" stroke-width="0" style="stroke:none;"/>

  <!-- inner disc (contracts) sits inside the gap -->
  <circle class="disc" cx="100" cy="100" r="58" fill="#1170ee"/>
</svg>
`;

document.getElementById('bigOrb').innerHTML = svgMarkup;
document.getElementById('miniOrb').innerHTML = svgMarkup;
</script>

</body>
</html>
