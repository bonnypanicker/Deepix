plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.parcelize"
    id "org.jetbrains.kotlin.kapt"
    id "io.gitlab.arturbosch.detekt"
}

detekt {
    config.setFrom(rootProject.file("detekt.yml"))
    buildUponDefaultConfig = true
    parallel = true
}

android {
    namespace "com.devomind.gallerysearch"
    compileSdk 35

    defaultConfig {
        applicationId "com.devomind.gallerysearch"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    androidResources {
        noCompress += "onnx"
        noCompress += "ort"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // ONNX Runtime bundles a native library per CPU architecture. Emit the normal device-specific
    // APKs instead of one universal APK containing all four copies; every supported ABI remains
    // available, while each installed APK is substantially smaller.
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.20"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-transformer:1.5.1"
    implementation "androidx.media3:media3-effect:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "com.github.chrisbanes:PhotoView:2.3.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.28.0"
    implementation "net.lingala.zip4j:zip4j:2.11.5"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    kapt "androidx.room:room-compiler:2.6.1"
    kapt "com.github.bumptech.glide:compiler:4.16.0"
}
